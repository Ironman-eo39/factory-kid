<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toy Factory — Staging (mockup)</title>
<style>
:root{
  --bg:#14161c; --surface:#1d2029; --surface-2:#242834; --border:#2e3342;
  --text-1:#f2f4f8; --text-2:#a7adbd; --text-3:#6b7284;
  --accent:#2dd4bf; --accent-2:#fb923c; --danger:#f87171; --success:#4ade80;
  --r-s:6px; --r-m:10px; --r-l:16px;
  --t-fast:150ms ease-out; --t-med:250ms ease-out;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{color-scheme:dark;}
body{background:var(--bg); color:var(--text-1); font-family:"Inter",system-ui,sans-serif; font-size:13px; height:100vh; display:flex; flex-direction:column; overflow:hidden;}
button{font-family:inherit; cursor:pointer;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

/* top bar */
.topbar{height:52px; flex:0 0 52px; display:flex; align-items:center; gap:12px; padding:0 16px; background:var(--surface); border-bottom:1px solid var(--border);}
.logo{font-weight:800; font-size:15px; letter-spacing:.5px;}
.logo span{color:var(--accent);}
.preset-name{background:var(--surface-2); border:1px solid var(--border); color:var(--text-1); border-radius:var(--r-s); padding:7px 10px; font-size:13px; width:240px;}
.preset-name:focus{border-color:var(--accent); outline:none;}
.topbar .spacer{flex:1;}
.btn{border:none; border-radius:var(--r-s); padding:8px 16px; font-size:13px; font-weight:600; transition:transform var(--t-fast), background var(--t-fast);}
.btn:active{transform:scale(.97);}
.btn-secondary{background:var(--surface-2); color:var(--text-1); border:1px solid var(--border);}
.btn-secondary:hover{border-color:var(--accent);}
.btn-record{background:var(--accent-2); color:#1a1206; font-size:14px; padding:10px 28px;}
.btn-record:hover{filter:brightness(1.08);}
.duration-pill{color:var(--text-2); font-variant-numeric:tabular-nums; border:1px solid var(--border); border-radius:20px; padding:6px 12px;}

/* main grid */
.main{flex:1; display:grid; grid-template-columns:288px 1fr 300px; grid-template-rows:1fr 168px; min-height:0;}
.library{grid-row:1/3; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; min-height:0;}
.stage{background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:16px; min-height:0; overflow:auto;}
.inspector{background:var(--surface); border-left:1px solid var(--border); overflow-y:auto; padding:14px;}
.timeline{background:var(--surface); border-top:1px solid var(--border); padding:10px 16px; display:flex; flex-direction:column; gap:8px;}

/* library */
.lib-tabs{display:flex; gap:4px; padding:10px 10px 0;}
.lib-tab{flex:1; background:none; border:none; color:var(--text-3); font-size:12px; font-weight:600; padding:8px 4px; border-bottom:2px solid transparent; transition:color var(--t-fast), border-color var(--t-fast);}
.lib-tab:hover{color:var(--text-2);}
.lib-tab.active{color:var(--accent); border-bottom-color:var(--accent);}
.lib-list{overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px;}
.mod-card{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-m); overflow:hidden; transition:border-color var(--t-fast), transform var(--t-fast); text-align:left; padding:0; color:var(--text-1); width:100%;}
.mod-card:hover{border-color:var(--accent); transform:translateY(-1px);}
.mod-card img{width:100%; height:96px; object-fit:cover; display:block; background:#0c0e12;}
.mod-card .meta{padding:8px 10px; display:flex; align-items:center; justify-content:space-between;}
.mod-card .name{font-weight:600; font-size:13px;}
.mod-card .sub{color:var(--text-3); font-size:11px; margin-top:2px; font-variant-numeric:tabular-nums;}
.mod-card .add{color:var(--accent); font-weight:700; font-size:12px; white-space:nowrap;}

/* stage phone */
.phone{width:228px; aspect-ratio:9/16; background:#000; border-radius:22px; border:3px solid #333a48; position:relative; overflow:hidden; flex:0 1 auto; min-height:0;}
.phone img.viewport{width:100%; height:100%; object-fit:cover; display:block;}
.phone .cam-badge{position:absolute; top:10px; left:10px; background:rgba(0,0,0,.55); border:1px solid var(--accent); color:var(--accent); font-size:10px; font-weight:700; padding:3px 8px; border-radius:12px; letter-spacing:.5px;}
.phone .slate{position:absolute; bottom:0; left:0; right:0; padding:10px; background:linear-gradient(transparent, rgba(0,0,0,.75));}
.phone .slate .t{font-size:12px; font-weight:700;}
.phone .slate .s{font-size:10px; color:var(--text-2); margin-top:2px;}
.cast-row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:560px;}
.chip{background:var(--surface-2); border:1px solid var(--border); color:var(--text-1); border-radius:16px; padding:6px 8px 6px 12px; font-size:12px; display:flex; align-items:center; gap:8px; transition:border-color var(--t-fast);}
.chip:hover{border-color:var(--text-3);}
.chip.selected{border-color:var(--accent);}
.chip .n{background:var(--accent); color:#062a26; font-weight:700; border-radius:10px; padding:1px 7px; font-size:11px; font-variant-numeric:tabular-nums;}
.chip .x{background:none; border:none; color:var(--text-3); font-size:14px; line-height:1; padding:2px;}
.chip .x:hover{color:var(--danger);}
.empty-hint{color:var(--text-3); font-size:12px;}

/* inspector */
.insp-section{margin-bottom:18px;}
.insp-section h3{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-3); margin-bottom:8px;}
.insp-empty{color:var(--text-3); font-size:12px; line-height:1.5;}
.row{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;}
.row label{font-size:12px; color:var(--text-2);}
.stepper{display:flex; align-items:center; gap:8px;}
.stepper button{width:26px; height:26px; border-radius:var(--r-s); border:1px solid var(--border); background:var(--surface-2); color:var(--text-1); font-size:15px; line-height:1; transition:border-color var(--t-fast);}
.stepper button:hover{border-color:var(--accent);}
.stepper .val{font-variant-numeric:tabular-nums; min-width:28px; text-align:center; font-weight:600;}
.swatches{display:flex; gap:6px;}
.swatch{width:26px; height:26px; border-radius:50%; border:2px solid transparent; padding:0; transition:border-color var(--t-fast), transform var(--t-fast);}
.swatch:hover{transform:scale(1.1);}
.swatch.selected{border-color:var(--text-1);}
.seg{display:flex; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-s); overflow:hidden;}
.seg button{flex:1; background:none; border:none; color:var(--text-2); font-size:12px; padding:7px 4px; transition:background var(--t-fast), color var(--t-fast);}
.seg button.selected{background:var(--accent); color:#062a26; font-weight:700;}
.beat-row{display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-s); padding:8px 10px; margin-bottom:6px;}
.beat-row .dot{width:10px; height:10px; background:var(--accent-2); transform:rotate(45deg); flex:0 0 10px;}
.beat-row input{width:64px; background:var(--bg); border:1px solid var(--border); color:var(--text-1); border-radius:var(--r-s); padding:5px 6px; font-size:12px; font-variant-numeric:tabular-nums;}
.beat-row .grow{flex:1; font-size:12px; color:var(--text-2);}
.beat-row .del{background:none; border:none; color:var(--text-3); font-size:14px;}
.beat-row .del:hover{color:var(--danger);}
.mini-btn{background:var(--surface-2); border:1px dashed var(--border); color:var(--text-2); border-radius:var(--r-s); padding:8px; width:100%; font-size:12px; transition:border-color var(--t-fast), color var(--t-fast);}
.mini-btn:hover{border-color:var(--accent); color:var(--text-1);}
select{background:var(--surface-2); border:1px solid var(--border); color:var(--text-1); border-radius:var(--r-s); padding:7px 8px; font-size:12px; width:100%;}
.cut-row{display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:12px; color:var(--text-2);}
.cut-row .tick{width:4px; height:16px; background:var(--accent); border-radius:2px;}
.cut-row input{width:56px; background:var(--bg); border:1px solid var(--border); color:var(--text-1); border-radius:var(--r-s); padding:4px 6px; font-size:12px; font-variant-numeric:tabular-nums;}

/* timeline */
.tl-head{display:flex; align-items:center; gap:10px;}
.tl-head .title{font-size:12px; font-weight:700; color:var(--text-2);}
.tl-head .hint{font-size:11px; color:var(--text-3);}
.tl-ruler{position:relative; height:64px; background:var(--bg); border:1px solid var(--border); border-radius:var(--r-m); overflow:hidden; cursor:crosshair;}
.tl-ticks{position:absolute; inset:0;}
.tl-tick{position:absolute; top:0; bottom:0; width:1px; background:#262b38;}
.tl-tick.major{background:#39404f;}
.tl-tick span{position:absolute; top:4px; left:4px; font-size:9px; color:var(--text-3); font-variant-numeric:tabular-nums;}
.tl-chant{position:absolute; left:0; right:0; bottom:0; height:16px; background:rgba(45,212,191,.14); border-top:1px solid rgba(45,212,191,.4);}
.tl-chant span{position:absolute; left:8px; top:2px; font-size:9px; color:var(--accent); font-weight:600;}
.tl-beat{position:absolute; top:18px; width:14px; height:14px; background:var(--accent-2); transform:translateX(-50%) rotate(45deg); border-radius:3px; cursor:grab; border:2px solid #14161c; transition:transform var(--t-fast);}
.tl-beat:hover{transform:translateX(-50%) rotate(45deg) scale(1.25);}
.tl-beat.selected{outline:2px solid #fff;}
.tl-cut{position:absolute; top:8px; width:4px; height:22px; background:var(--accent); transform:translateX(-50%); border-radius:2px; cursor:grab;}
.tl-playhead{position:absolute; top:0; bottom:0; width:2px; background:#fff; transform:translateX(-50%); pointer-events:none;}
.tl-playhead::before{content:""; position:absolute; top:0; left:-5px; border:6px solid transparent; border-top:8px solid #fff;}

/* record modal */
.modal-back{position:fixed; inset:0; background:rgba(8,10,14,.7); display:none; align-items:center; justify-content:center; z-index:50;}
.modal-back.open{display:flex;}
.modal{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-l); padding:28px; width:380px; text-align:center;}
.modal h2{font-size:18px; margin-bottom:6px; text-wrap:balance;}
.modal p{color:var(--text-2); font-size:12px; margin-bottom:16px; font-variant-numeric:tabular-nums;}
.prog{height:10px; background:var(--bg); border-radius:6px; overflow:hidden; margin-bottom:12px;}
.prog .fill{height:100%; width:0%; background:var(--accent-2); border-radius:6px; transition:width 200ms linear;}
.modal .ok{color:var(--success); font-size:40px; margin-bottom:8px;}
.modal .file{background:var(--bg); border:1px solid var(--border); border-radius:var(--r-s); padding:8px 10px; font-size:11px; color:var(--text-2); margin:12px 0; word-break:break-all;}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>

const MODULES = [
  {id:"day_arena", type:"arenas", name:"Day Arena", sub:"Arena · 12.4k tris", thumb:"arena"},
  {id:"sedan", type:"vehicles", name:"Sedan", sub:"Vehicle · 2,032 tris", thumb:"sedan"},
  {id:"moon_ball", type:"vehicles", name:"Moon Ball", sub:"Vehicle · 1,140 tris", thumb:"moon"},
  {id:"plonko", type:"characters", name:"Plonko", sub:"Character · 1,890 tris", thumb:"plonko"},
  {id:"test_hammer", type:"destroyers", name:"Smash Hammer", sub:"Destroyer · 640 tris", thumb:"hammer"},
  {id:"test_axe", type:"destroyers", name:"Battle Axe", sub:"Destroyer · 580 tris", thumb:"axe"},
  {id:"test_hand", type:"destroyers", name:"Slap Hand", sub:"Destroyer · 720 tris", thumb:"hand"},
];
const TINTS = ["#8B5E34","#E4572E","#2DD4BF","#F5C518","#7C5CFF","#F2F4F8"];
const state = {
  tab:"arenas", cast:[], selected:null, playhead:0,
  beats:[{t:12},{t:30},{t:48}], cuts:[{t:0,mode:"wide"},{t:20,mode:"low"},{t:40,mode:"follow"}],
  cameraMode:"wide", music:"chant_placeholder.wav", duration:60, recording:false
};
const $ = s => document.querySelector(s);

/* library */
function renderLibrary(){
  const list = $("#libList"); list.innerHTML = "";
  MODULES.filter(m=>m.type===state.tab).forEach(m=>{
    const b = document.createElement("button");
    b.className = "mod-card";
    b.innerHTML = `<img src="${THUMBS[m.thumb]}" alt="${m.name} preview"><div class="meta"><div><div class="name">${m.name}</div><div class="sub">${m.sub}</div></div><span class="add">+ Add</span></div>`;
    b.onclick = ()=>addToCast(m);
    list.appendChild(b);
  });
}
document.querySelectorAll(".lib-tab").forEach(t=>{
  t.onclick = ()=>{ document.querySelectorAll(".lib-tab").forEach(x=>x.classList.remove("active")); t.classList.add("active"); state.tab = t.dataset.tab; renderLibrary(); };
});

/* cast */
function addToCast(m){
  if(m.type==="arenas"){ $("#stageImg").src = THUMBS[m.thumb]; $("#slateSub").textContent = `${m.name} · ${state.cast.reduce((a,c)=>a+c.count,0)} cast · ${state.duration}s`; return; }
  const ex = state.cast.find(c=>c.id===m.id);
  if(ex){ ex.count++; } else { state.cast.push({id:m.id, name:m.name, thumb:m.thumb, count:3, tint:TINTS[0], expr:"happy"}); }
  state.selected = m.id; renderCast(); renderInspector();
}
function renderCast(){
  const row = $("#castRow"); row.innerHTML = "";
  if(!state.cast.length){ row.innerHTML = `<span class="empty-hint">Click a module on the left to add it to the cast.</span>`; return; }
  state.cast.forEach(c=>{
    const ch = document.createElement("button");
    ch.className = "chip" + (state.selected===c.id ? " selected" : "");
    ch.innerHTML = `${c.name} <span class="n">${c.count}</span><span class="x" aria-label="Remove ${c.name}">×</span>`;
    ch.onclick = e=>{ if(e.target.classList.contains("x")){ state.cast = state.cast.filter(x=>x.id!==c.id); if(state.selected===c.id) state.selected = state.cast[0]?.id ?? null; } else { state.selected = c.id; } renderCast(); renderInspector(); };
    row.appendChild(ch);
  });
  const total = state.cast.reduce((a,c)=>a+c.count,0);
  $("#slateSub").textContent = `Day Arena · ${total} cast · ${state.duration}s`;
}

/* inspector */
function renderInspector(){
  const box = $("#inspector"); const c = state.cast.find(x=>x.id===state.selected);
  let h = "";
  if(c){
    h += `<div class="insp-section"><h3>Roster — ${c.name}</h3>
      <div class="row"><label>Count</label><div class="stepper"><button data-act="dec" aria-label="Fewer">−</button><span class="val">${c.count}</span><button data-act="inc" aria-label="More">+</button></div></div>
      <div class="row"><label>Paint</label><div class="swatches">${TINTS.map(t=>`<button class="swatch${c.tint===t?" selected":""}" data-tint="${t}" style="background:${t}" aria-label="Tint ${t}"></button>`).join("")}</div></div>
      <div class="row"><label>Face</label></div>
      <div class="seg">${["happy","angry","dizzy"].map(e=>`<button data-expr="${e}" class="${c.expr===e?"selected":""}">${e[0].toUpperCase()+e.slice(1)}</button>`).join("")}</div>
    </div>`;
  } else {
    h += `<div class="insp-section"><h3>Roster</h3><p class="insp-empty">Add a vehicle or character from the library, then click its chip to tune count, paint and face.</p></div>`;
  }
  h += `<div class="insp-section"><h3>Destroyer beats</h3><div id="beatList"></div><button class="mini-btn" id="addBeat2">+ Add beat at playhead (${state.playhead.toFixed(1)}s)</button></div>`;
  h += `<div class="insp-section"><h3>Camera</h3>
    <div class="seg" style="margin-bottom:8px">${["wide","low","follow"].map(m=>`<button data-cam="${m}" class="${state.cameraMode===m?"selected":""}">${m[0].toUpperCase()+m.slice(1)}</button>`).join("")}</div>
    <div id="cutList">${state.cuts.map((ct,i)=>`<div class="cut-row"><span class="tick"></span><span>Cut ${i+1}</span><input type="number" value="${ct.t}" min="0" max="${state.duration}" step="1" data-cut="${i}" aria-label="Cut ${i+1} time">s<span>${ct.mode}</span></div>`).join("")}</div>
    <button class="mini-btn" id="addCut">+ Add camera cut at playhead</button></div>`;
  h += `<div class="insp-section"><h3>Music &amp; length</h3>
    <div class="row"><label>Chant</label></div>
    <select id="musicSel" aria-label="Chant track"><option>chant_placeholder.wav</option><option>suno_export_01.wav</option><option>(none)</option></select>
    <div class="row" style="margin-top:10px"><label>Duration</label><div class="stepper"><button data-dur="-5" aria-label="Shorter">−</button><span class="val">${state.duration}s</span><button data-dur="5" aria-label="Longer">+</button></div></div>
  </div>`;
  box.innerHTML = h;
  renderBeatList();
  box.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{ c.count = Math.max(1, Math.min(24, c.count + (b.dataset.act==="inc"?1:-1))); renderCast(); renderInspector(); });
  box.querySelectorAll("[data-tint]").forEach(b=>b.onclick=()=>{ c.tint = b.dataset.tint; renderInspector(); });
  box.querySelectorAll("[data-expr]").forEach(b=>b.onclick=()=>{ c.expr = b.dataset.expr; renderInspector(); });
  box.querySelectorAll("[data-cam]").forEach(b=>b.onclick=()=>{ state.cameraMode = b.dataset.cam; $("#camBadge").textContent = state.cameraMode.toUpperCase(); renderInspector(); renderMarkers(); });
  box.querySelectorAll("[data-dur]").forEach(b=>b.onclick=()=>{ state.duration = Math.max(5, Math.min(60, state.duration + (+b.dataset.dur))); $("#durPill").textContent = `${state.duration}s · 1080×1920 · 30fps`; renderTicks(); renderMarkers(); renderInspector(); });
  box.querySelectorAll("[data-cut]").forEach(inp=>inp.onchange=()=>{ const i=+inp.dataset.cut; state.cuts[i].t = Math.max(0, Math.min(state.duration, +inp.value||0)); renderMarkers(); });
  $("#addBeat2").onclick = addBeatAtPlayhead;
  $("#addCut").onclick = ()=>{ state.cuts.push({t:Math.round(state.playhead), mode:state.cameraMode}); state.cuts.sort((a,b)=>a.t-b.t); renderInspector(); renderMarkers(); };
  $("#musicSel").onchange = e=>{ state.music = e.target.value; document.querySelector(".tl-chant span").textContent = state.music; };
}
function renderBeatList(){
  const bl = $("#beatList"); if(!bl) return; bl.innerHTML = "";
  state.beats.forEach((b,i)=>{
    const r = document.createElement("div"); r.className = "beat-row";
    r.innerHTML = `<span class="dot"></span><span class="grow">Slam ${i+1} → squash + shake</span><input type="number" value="${b.t}" min="0" max="${state.duration}" step="0.5" aria-label="Beat ${i+1} time"><span style="color:var(--text-3);font-size:11px">s</span><button class="del" aria-label="Delete beat ${i+1}">×</button>`;
    r.querySelector("input").onchange = e=>{ b.t = Math.max(0, Math.min(state.duration, +e.target.value||0)); renderMarkers(); };
    r.querySelector(".del").onclick = ()=>{ state.beats.splice(i,1); renderBeatList(); renderMarkers(); };
    bl.appendChild(r);
  });
}

/* timeline */
function renderTicks(){
  const t = $("#ticks"); t.innerHTML = "";
  for(let s=0; s<=state.duration; s+=5){
    const d = document.createElement("div");
    d.className = "tl-tick" + (s%15===0 ? " major" : "");
    d.style.left = (s/state.duration*100)+"%";
    if(s%15===0) d.innerHTML = `<span>${s}s</span>`;
    t.appendChild(d);
  }
}
function renderMarkers(){
  const m = $("#markers"); m.innerHTML = "";
  state.cuts.forEach(ct=>{
    const d = document.createElement("div"); d.className = "tl-cut"; d.title = `Camera: ${ct.mode} @ ${ct.t}s`;
    d.style.left = (ct.t/state.duration*100)+"%"; m.appendChild(d);
  });
  state.beats.forEach(b=>{
    const d = document.createElement("div"); d.className = "tl-beat"; d.title = `Slam @ ${b.t}s`;
    d.style.left = (b.t/state.duration*100)+"%";
    d.onmousedown = ev=>{ ev.preventDefault(); const move = e2=>{ const r = $("#ruler").getBoundingClientRect(); b.t = Math.max(0, Math.min(state.duration, (e2.clientX-r.left)/r.width*state.duration)); d.style.left = (b.t/state.duration*100)+"%"; }; const up = ()=>{ document.removeEventListener("mousemove",move); document.removeEventListener("mouseup",up); renderBeatList(); }; document.addEventListener("mousemove",move); document.addEventListener("mouseup",up); };
    m.appendChild(d);
  });
  $("#playhead").style.left = (state.playhead/state.duration*100)+"%";
}
$("#ruler").onclick = e=>{ if(e.target.closest(".tl-beat")) return; const r = $("#ruler").getBoundingClientRect(); state.playhead = Math.max(0, Math.min(state.duration, (e.clientX-r.left)/r.width*state.duration)); $("#playhead").style.left = (state.playhead/state.duration*100)+"%"; const ab = $("#addBeat2"); if(ab) ab.textContent = `+ Add beat at playhead (${state.playhead.toFixed(1)}s)`; };
function addBeatAtPlayhead(){ state.beats.push({t:Math.round(state.playhead*2)/2}); state.beats.sort((a,b)=>a.t-b.t); renderBeatList(); renderMarkers(); }
$("#addBeatBtn").onclick = addBeatAtPlayhead;

/* record */
$("#recordBtn").onclick = ()=>{
  const back = $("#modalBack"), mb = $("#modalBox");
  back.classList.add("open");
  mb.innerHTML = `<h2>Recording ${$("#presetName").value || "untitled"}.mp4</h2><p>Godot Movie Maker · --fixed-fps 30 · ${state.duration}s</p><div class="prog"><div class="fill" id="pfill"></div></div><p id="pstat">Rendering frame 0 / ${state.duration*30}…</p>`;
  let f = 0; const total = state.duration*30;
  const iv = setInterval(()=>{
    f = Math.min(total, f + Math.ceil(total/24));
    $("#pfill").style.width = (f/total*100)+"%";
    $("#pstat").textContent = `Rendering frame ${f} / ${total}…`;
    if(f>=total){ clearInterval(iv);
      mb.innerHTML = `<div class="ok">✓</div><h2>Render complete</h2><div class="file">/renders/${$("#presetName").value || "untitled"}.final.mp4<br>1080×1920 · 30fps · H.264/AAC · ${state.duration}.0s</div><p>Verified: resolution ✓ fps ✓ audio ✓ duration ✓</p><button class="btn btn-secondary" id="closeModal">Back to staging</button>`;
      $("#closeModal").onclick = ()=>back.classList.remove("open");
    }
  }, 140);
};
$("#saveBtn").onclick = e=>{ const b = e.target; b.textContent = "Saved ✓"; setTimeout(()=>b.textContent="Save preset", 1200); };
$("#presetName").oninput = e=>{ $("#slateTitle").textContent = e.target.value || "untitled"; };

renderLibrary(); renderCast(); renderInspector(); renderTicks(); renderMarkers();
</script>
</body>
</html>
